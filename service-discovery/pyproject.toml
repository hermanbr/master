[project]
name = "sd"
version = "0.2.0"
description = "Service discovery (SSSD, mDNS, Zenoh) over 5G MBS broadcast and WiFi"
readme = "README.md"
authors = [
    { name = "hermanbr", email = "hermanbjriis@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "eclipse-zenoh>=1.0,<2",
    "zeroconf>=0.131",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
